syntax = "proto3";

package csi.v1;

service Identity {
  rpc GetPluginInfo(GetPluginInfoRequest) returns (GetPluginInfoResponse);
  rpc GetPluginCapabilities(GetPluginCapabilitiesRequest) returns (GetPluginCapabilitiesResponse);
  rpc Probe(ProbeRequest) returns (ProbeResponse);
}

service Controller {
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);
  rpc ControllerPublishVolume(ControllerPublishVolumeRequest) returns (ControllerPublishVolumeResponse);
  rpc ControllerUnpublishVolume(ControllerUnpublishVolumeRequest) returns (ControllerUnpublishVolumeResponse);
  rpc ValidateVolumeCapabilities(ValidateVolumeCapabilitiesRequest) returns (ValidateVolumeCapabilitiesResponse);
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
  rpc GetCapacity(GetCapacityRequest) returns (GetCapacityResponse);
  rpc ControllerGetCapabilities(ControllerGetCapabilitiesRequest) returns (ControllerGetCapabilitiesResponse);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
}

service Node {
  rpc NodeStageVolume(NodeStageVolumeRequest) returns (NodeStageVolumeResponse);
  rpc NodeUnstageVolume(NodeUnstageVolumeRequest) returns (NodeUnstageVolumeResponse);
  rpc NodePublishVolume(NodePublishVolumeRequest) returns (NodePublishVolumeResponse);
  rpc NodeUnpublishVolume(NodeUnpublishVolumeRequest) returns (NodeUnpublishVolumeResponse);
  rpc NodeGetInfo(NodeGetInfoRequest) returns (NodeGetInfoResponse);
  rpc NodeGetCapabilities(NodeGetCapabilitiesRequest) returns (NodeGetCapabilitiesResponse);
}

message GetPluginInfoRequest {}

message GetPluginInfoResponse {
  string name = 1;
  string vendor_version = 2;
  map<string, string> manifest = 3;
}

message GetPluginCapabilitiesRequest {}

message GetPluginCapabilitiesResponse {
  repeated PluginCapability capabilities = 1;
}

message PluginCapability {
  enum ServiceType {
    UNKNOWN = 0;
    CONTROLLER_SERVICE = 1;
    VOLUME_ACCESSIBILITY_CONSTRAINTS = 2;
  }
  ServiceType service = 1;
}

message ProbeRequest {}

message ProbeResponse {
  bool ready = 1;
}

message VolumeCapability {
  message MountVolume {
    string fs_type = 1;
    repeated string mount_flags = 2;
  }
  message BlockVolume {}
  message AccessMode {
    enum Mode {
      UNKNOWN = 0;
      SINGLE_NODE_WRITER = 1;
      SINGLE_NODE_READER_ONLY = 2;
      MULTI_NODE_READER_ONLY = 3;
      MULTI_NODE_SINGLE_WRITER = 4;
      MULTI_NODE_MULTI_WRITER = 5;
    }
    Mode mode = 1;
  }

  oneof access_type {
    MountVolume mount = 1;
    BlockVolume block = 2;
  }
  AccessMode access_mode = 3;
}

message CapacityRange {
  int64 required_bytes = 1;
  int64 limit_bytes = 2;
}

message Volume {
  string volume_id = 1;
  int64 capacity_bytes = 2;
  map<string, string> volume_context = 3;
}

message CreateVolumeRequest {
  string name = 1;
  CapacityRange capacity_range = 2;
  repeated VolumeCapability volume_capabilities = 3;
  map<string, string> parameters = 4;
}

message CreateVolumeResponse {
  Volume volume = 1;
}

message DeleteVolumeRequest {
  string volume_id = 1;
}

message DeleteVolumeResponse {}

message ControllerPublishVolumeRequest {
  string volume_id = 1;
  string node_id = 2;
  bool readonly = 3;
  repeated VolumeCapability volume_capability = 4;
}

message ControllerPublishVolumeResponse {
  map<string, string> publish_context = 1;
}

message ControllerUnpublishVolumeRequest {
  string volume_id = 1;
  string node_id = 2;
}

message ControllerUnpublishVolumeResponse {}

message ValidateVolumeCapabilitiesRequest {
  string volume_id = 1;
  repeated VolumeCapability volume_capabilities = 2;
}

message ValidateVolumeCapabilitiesResponse {
  message Confirmed {
    string volume_context_id = 1;
    repeated VolumeCapability volume_capabilities = 2;
  }
  Confirmed confirmed = 1;
  string message = 2;
}

message ListVolumesRequest {
  int32 max_entries = 1;
  string starting_token = 2;
}

message ListVolumesResponse {
  message Entry {
    Volume volume = 1;
  }
  repeated Entry entries = 1;
  string next_token = 2;
}

message GetCapacityRequest {
  map<string, string> parameters = 1;
}

message GetCapacityResponse {
  int64 available_capacity = 1;
}

message ControllerGetCapabilitiesRequest {}

message ControllerServiceCapability {
  enum Type {
    UNKNOWN = 0;
    CREATE_DELETE_VOLUME = 1;
    PUBLISH_UNPUBLISH_VOLUME = 2;
    LIST_VOLUMES = 3;
    GET_CAPACITY = 4;
    CREATE_DELETE_SNAPSHOT = 5;
    LIST_SNAPSHOTS = 6;
  }
  Type type = 1;
}

message ControllerGetCapabilitiesResponse {
  repeated ControllerServiceCapability capabilities = 1;
}

message Snapshot {
  string snapshot_id = 1;
  string source_volume_id = 2;
  int64 size_bytes = 3;
  int64 creation_time_unix_seconds = 4;
  bool ready_to_use = 5;
}

message CreateSnapshotRequest {
  string source_volume_id = 1;
  string name = 2;
  map<string, string> parameters = 3;
}

message CreateSnapshotResponse {
  Snapshot snapshot = 1;
}

message DeleteSnapshotRequest {
  string snapshot_id = 1;
}

message DeleteSnapshotResponse {}

message ListSnapshotsRequest {
  string source_volume_id = 1;
}

message ListSnapshotsResponse {
  message Entry {
    Snapshot snapshot = 1;
  }
  repeated Entry entries = 1;
}

message NodeStageVolumeRequest {
  string volume_id = 1;
  string staging_target_path = 2;
  bool readonly = 3;
  VolumeCapability volume_capability = 4;
}

message NodeStageVolumeResponse {}

message NodeUnstageVolumeRequest {
  string volume_id = 1;
  string staging_target_path = 2;
}

message NodeUnstageVolumeResponse {}

message NodePublishVolumeRequest {
  string volume_id = 1;
  string staging_target_path = 2;
  string target_path = 3;
  bool readonly = 4;
  VolumeCapability volume_capability = 5;
}

message NodePublishVolumeResponse {}

message NodeUnpublishVolumeRequest {
  string volume_id = 1;
  string target_path = 2;
}

message NodeUnpublishVolumeResponse {}

message NodeGetInfoRequest {}

message NodeGetInfoResponse {
  string node_id = 1;
}

message NodeGetCapabilitiesRequest {}

message NodeServiceCapability {
  enum Type {
    UNKNOWN = 0;
    STAGE_UNSTAGE_VOLUME = 1;
  }
  Type type = 1;
}

message NodeGetCapabilitiesResponse {
  repeated NodeServiceCapability capabilities = 1;
}
