[workspace]
members = [
    "crates/cluster-manager",
    "crates/csi-driver",
    "crates/discovery",
    "crates/host-agent",
    "crates/node-plugin",
    "crates/truenas-client",
    "crates/types",
    "crates/vm-manager",
    "crates/xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://example.invalid/nas-csi"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
nas-csi-types = { path = "crates/types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
