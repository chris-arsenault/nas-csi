[workspace]
members = [
    "crates/cluster-manager",
    "crates/csi-proto",
    "crates/csi-driver",
    "crates/discovery",
    "crates/host-agent",
    "crates/node-plugin",
    "crates/truenas-client",
    "crates/types",
    "crates/vm-manager",
    "crates/xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://example.invalid/nas-csi"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
nas-csi-types = { path = "crates/types" }
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
sha2 = "0.10"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
protoc-bin-vendored = "3.2"
